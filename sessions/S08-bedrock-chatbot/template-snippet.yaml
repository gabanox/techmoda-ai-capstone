# ============================================================================
# S8 · Bedrock chatbot RAG (asistente de compras)  —  pegar en template.yaml
# ============================================================================
# Reusa los embeddings de S7. Necesita InvokeModel sobre DOS modelos:
# el de embeddings (retrieval) y el de generacion (chat).
# Patrón sandbox: Function URL propia + LabRole (sin API Gateway, sin Policies).
# Ver docs/SANDBOX-COMPAT.md.

  ShoppingAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ShoppingAssistant
      Description: S8 - Asistente de compras conversacional (Bedrock RAG)
      CodeUri: sessions/S08-bedrock-chatbot/functions/shopping-assistant
      Handler: app.lambda_handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Timeout: 60
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          ASSISTANT_TOP_K: "3"
          BEDROCK_MAX_TOKENS: "400"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

# ----------------------------------------------------------------------------
# FUNCTION URL — Outputs:
#   ShoppingAssistantUrl:
#     Value: !GetAtt ShoppingAssistantFunctionUrl.FunctionUrl
#
# Invocación (la pregunta va en el body):
#   curl -X POST "$URL" -H 'Content-Type: application/json' \
#        -d '{"message":"busco un abrigo para el invierno"}'
#
# El LabRole ya permite bedrock:InvokeModel (Titan embeddings + modelo de chat).
# Corré primero el indexador de S7 (POST $INDEX_URL) para tener embeddings.
# ----------------------------------------------------------------------------
