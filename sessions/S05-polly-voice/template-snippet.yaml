# ============================================================================
# S5 · Amazon Polly + bucket de audio  —  pegar en template.yaml
# ============================================================================
# Agrega 1 bucket S3 (audio) y 1 Lambda con Function URL propia (patrón sandbox:
# LabRole, sin API Gateway, sin Policies). Ver docs/SANDBOX-COMPAT.md.

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-audio
      # Sin acceso público: el audio se sirve por URL prefirmada (mejor práctica).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAudio
            Status: Enabled
            ExpirationInDays: 7   # FinOps: el audio de demo no se acumula

  SynthesizeVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SynthesizeVoice
      Description: S5 - Descripcion por voz / accesibilidad (Amazon Polly)
      CodeUri: sessions/S05-polly-voice/functions/synthesize-voice
      Handler: app.lambda_handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          AUDIO_BUCKET: !Ref AudioBucket
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

# ----------------------------------------------------------------------------
# FUNCTION URL — Outputs:
#   SynthesizeVoiceUrl:
#     Value: !GetAtt SynthesizeVoiceFunctionUrl.FunctionUrl
#
# Invocación (id por path o body; lang en el body):
#   curl -X POST "${URL%/}/products/<PRODUCT_ID>/voice" \
#        -H 'Content-Type: application/json' -d '{"lang":"es"}'
#
# El LabRole ya permite polly:SynthesizeSpeech y s3:* sobre el bucket de audio.
# ----------------------------------------------------------------------------
