# ============================================================================
# S3 · Comprehend DetectSentiment  —  pegar en template.yaml
# ============================================================================
# Patrón: Function URL propia (sin API Gateway) + `Policies:` de mínimo privilegio
# (SAM crea el rol). Ver docs/IAM.md.
# Ver docs/SANDBOX-COMPAT.md.
# ----------------------------------------------------------------------------

  AnalyzeSentimentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-AnalyzeSentiment
      Description: S3 - Sentimiento de resenas (Amazon Comprehend)
      CodeUri: sessions/S03-comprehend-sentiment/functions/analyze-sentiment
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action:
                - comprehend:DetectSentiment
                # El handler detecta el idioma ANTES de analizar el sentimiento
                # (detect_dominant_language). Sin esta accion falla con AccessDenied:
                # la politica tiene que cubrir las APIs que el codigo LLAMA, no solo
                # la que le da nombre a la sesion.
                - comprehend:DetectDominantLanguage
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

# ----------------------------------------------------------------------------
# FUNCTION URL — Outputs:
#   AnalyzeSentimentUrl:
#     Value: !GetAtt AnalyzeSentimentFunctionUrl.FunctionUrl
#
# Invocación (el texto va en el body; este endpoint NO usa productId en el path):
#   curl -X POST "$URL" -H 'Content-Type: application/json' \
#        -d '{"text":"Me encantó la calidad de la tela"}'
#
# Permisos concedidos: comprehend:DetectSentiment + comprehend:DetectDominantLanguage.
# Los DOS son necesarios: el handler detecta el idioma antes de analizar. Con solo
# DetectSentiment la Lambda falla con AccessDenied en la primera invocación.
# ----------------------------------------------------------------------------
