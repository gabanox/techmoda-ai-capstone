# ============================================================================
# S4 · Amazon Translate  —  pegar en template.yaml
# ============================================================================

  TranslateCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-TranslateCatalog
      Description: S4 - Catalogo multilingue ES/EN (Amazon Translate)
      CodeUri: sessions/S04-translate-multilang/functions/translate-catalog
      Handler: app.lambda_handler
      Runtime: python3.12
      Events:
        ApiPOSTProductTranslate:
          Type: Api
          Properties:
            Path: /products/{id}/translate
            Method: POST
            RestApiId: !Ref ProductsApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
                - comprehend:DetectDominantLanguage  # Translate usa Comprehend para source=auto
              Resource: "*"

