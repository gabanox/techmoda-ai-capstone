# ============================================================================
# S4 · Amazon Translate  —  pegar en template.yaml
# ============================================================================
# Patrón: Function URL propia (sin API Gateway) + `Policies:` de mínimo privilegio
# (SAM crea el rol). Ver docs/IAM.md.
# Ver docs/SANDBOX-COMPAT.md.
# ----------------------------------------------------------------------------

  TranslateCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-TranslateCatalog
      Description: S4 - Catalogo multilingue ES/EN (Amazon Translate)
      CodeUri: sessions/S04-translate-multilang/functions/translate-catalog
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
                # Con SourceLanguageCode="auto", Translate llama a Comprehend POR
                # DENTRO para detectar el idioma. Sin esta accion falla con
                # DownstreamDependencyAccessDeniedException. Es el caso clasico de
                # permiso que no se ve leyendo solo el nombre de la API.
                - comprehend:DetectDominantLanguage
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

# ----------------------------------------------------------------------------
# FUNCTION URL — Outputs:
#   TranslateCatalogUrl:
#     Value: !GetAtt TranslateCatalogFunctionUrl.FunctionUrl
#
# Invocación (id por path o body; target en el body):
#   curl -X POST "${URL%/}/products/<PRODUCT_ID>/translate" \
#        -H 'Content-Type: application/json' -d '{"target":"en"}'
#
# Permisos concedidos: translate:TranslateText + comprehend:DetectDominantLanguage.
# El segundo NO es opcional: con SourceLanguageCode="auto", Translate llama a
# Comprehend por dentro y sin ese permiso devuelve
# DownstreamDependencyAccessDeniedException.
# ----------------------------------------------------------------------------
