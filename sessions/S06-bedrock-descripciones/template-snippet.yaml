# ============================================================================
# S6 · Amazon Bedrock (generacion)  —  pegar en template.yaml
# ============================================================================
# Patrón sandbox: Function URL propia + LabRole (sin API Gateway, sin Policies).
# Ver docs/SANDBOX-COMPAT.md.
# ----------------------------------------------------------------------------

  GenerateDescriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GenerateDescription
      Description: S6 - Generar descripciones de producto (Bedrock / GenAI)
      CodeUri: sessions/S06-bedrock-descripciones/functions/generate-description
      Handler: app.lambda_handler
      Runtime: python3.12
      Role: !Ref LabRoleArn
      Timeout: 60   # los modelos generativos pueden tardar varios segundos
      Environment:
        Variables:
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          BEDROCK_MAX_TOKENS: "300"
          BEDROCK_TEMPERATURE: "0.7"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

# ----------------------------------------------------------------------------
# FUNCTION URL — Outputs:
#   GenerateDescriptionUrl:
#     Value: !GetAtt GenerateDescriptionFunctionUrl.FunctionUrl
#
# Invocación (id por path o body):
#   curl -X POST "${URL%/}/products/<PRODUCT_ID>/describe" \
#        -H 'Content-Type: application/json' -d '{"tone":"elegante","save":true}'
#
# El LabRole ya permite bedrock:InvokeModel. Habilitá el modelo en
# Bedrock > Model access (us-east-1) antes de invocar.
# NOTA: si usás un inference profile, ajustá BEDROCK_MODEL_ID (prefijo "us.").
# ----------------------------------------------------------------------------
