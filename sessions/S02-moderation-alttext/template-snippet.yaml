# ============================================================================
# S2 · Rekognition DetectModerationLabels + alt-text  —  pegar en template.yaml
# ============================================================================

  ModerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ModerateImage
      Description: S2 - Moderacion de imagen + alt-text accesible (Rekognition)
      CodeUri: sessions/S02-moderation-alttext/functions/moderate-image
      Handler: app.lambda_handler
      Runtime: python3.12
      Environment:
        Variables:
          MODERATION_MIN_CONFIDENCE: "60"
      Events:
        ApiPOSTProductModerate:
          Type: Api
          Properties:
            Path: /products/{id}/moderate
            Method: POST
            RestApiId: !Ref ProductsApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels
                - rekognition:DetectLabels   # para construir el alt-text
              Resource: "*"   # APIs Detect: no admiten ARN a nivel de recurso
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-frontend/*

