Transform: AWS::Serverless-2016-10-31
Description: TechModa Serverless Capstone - Fashion E-commerce Product Catalog API (sandbox AWS re/Start compatible)

# ============================================================================
# COMPATIBILIDAD CON EL SANDBOX AWS re/Start (vocareum) — ver docs/SANDBOX-COMPAT.md
#   1. SIN API Gateway: el LabRole no permite apigateway:* -> usamos UNA Lambda
#      Function URL (AuthType NONE) + un router interno (functions/router).
#   2. SIN iam:CreateRole: cada función referencia el LabRole preexistente; NO se
#      usan `Policies:` (SAM las traduce a roles nuevos). Role y Policies son
#      mutuamente excluyentes en SAM.
#   3. Deploy: sam build && sam deploy --stack-name techmoda-ai --region us-east-1 \
#                --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
#                --resolve-s3 --no-confirm-changeset
# ============================================================================

Parameters:
  LabRoleArn:
    Type: String
    Default: arn:aws:iam::879652687082:role/LabRole
    Description: >-
      Rol de ejecución preexistente del sandbox (LabRole). El sandbox no permite
      iam:CreateRole, así que TODAS las Lambdas reusan este rol.

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs22.x
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable

Resources:
  # DynamoDB Table
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Products
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  # ---------------------------------------------------------------------------
  # Router CRUD — una sola Lambda, una sola Function URL (reemplaza API Gateway).
  # CodeUri: functions/  +  Handler: router/index.handler  => el router puede
  # require('../list-items') etc. porque todo functions/ va en el mismo paquete.
  # ---------------------------------------------------------------------------
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-Router
      Description: Router CRUD de /products via Lambda Function URL (sandbox-compatible)
      CodeUri: functions/
      Handler: router/index.handler
      Role: !Ref LabRoleArn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"

  # ---------------------------------------------------------------------------
  # Frontend estático (S3 + CloudFront). Permitido por el LabRole.
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-frontend
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${FrontendBucket.Arn}/*
            Principal: '*'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: Base API URL (Lambda Function URL del router CRUD). Termina en '/'.
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
  ProductsTableName:
    Description: Name of the DynamoDB Products table
    Value: !Ref ProductsTable
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
  FrontendUrl:
    Description: CloudFront URL for the frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Description: S3 Bucket name for frontend
    Value: !Ref FrontendBucket

Metadata:
  AWS::Composer::Groups:
    Group:
      Label: API Compute
      Members:
        - RouterFunction
