Transform: AWS::Serverless-2016-10-31
Description: TechModa AI Capstone - version ENSAMBLADA (base S0 + todas las sesiones S1-S10 cableadas)

# ============================================================================
# Este archivo es la version "todo junto" del capstone, util para:
#   - desplegar todo de una (sam deploy --template template.full.yaml), o
#   - verificar que los snippets de cada sesion componen correctamente.
# El flujo pedagogico recomendado sigue siendo ir pegando los snippets de cada
# sesion en template.yaml, uno por hora. Ambos llegan al mismo resultado.
# ============================================================================

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs22.x          # default; las Lambdas Python overridean Runtime
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
    Tags:                         # S10: cost allocation tags
      Project: techmoda-ai-capstone
      Module: ai-practitioner
      Environment: sandbox
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  ProductsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: ProductsApi
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info:
          title: TechModa AI Products API
          version: '1.0'
        paths:
          /products:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListItemsFunction.Arn}/invocations
              responses: {}
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateItemFunction.Arn}/invocations
              responses: {}
          /products/{id}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetItemFunction.Arn}/invocations
              responses: {}
            put:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateItemFunction.Arn}/invocations
              responses: {}
            delete:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteItemFunction.Arn}/invocations
              responses: {}
          /products/{id}/labels:        # S1
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EnrichLabelsFunction.Arn}/invocations
              responses: {}
          /products/{id}/moderate:      # S2
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ModerateImageFunction.Arn}/invocations
              responses: {}
          /sentiment:                   # S3
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyzeSentimentFunction.Arn}/invocations
              responses: {}
          /products/{id}/translate:     # S4
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TranslateCatalogFunction.Arn}/invocations
              responses: {}
          /products/{id}/voice:         # S5
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SynthesizeVoiceFunction.Arn}/invocations
              responses: {}
          /products/{id}/describe:      # S6
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GenerateDescriptionFunction.Arn}/invocations
              responses: {}
          /search/index:                # S7
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IndexEmbeddingsFunction.Arn}/invocations
              responses: {}
          /search:                      # S7
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SemanticSearchFunction.Arn}/invocations
              responses: {}
          /assistant:                   # S8
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ShoppingAssistantFunction.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Products
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  # ---- CRUD base (S0) ----
  ListItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ListItems
      CodeUri: functions/list-items
      Handler: index.handler
      Events:
        ApiGETProducts:
          Type: Api
          Properties: { Path: /products, Method: GET, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }

  CreateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CreateItem
      CodeUri: functions/create-item
      Handler: index.handler
      Events:
        ApiPOSTProducts:
          Type: Api
          Properties: { Path: /products, Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref ProductsTable }

  GetItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GetItem
      CodeUri: functions/get-item
      Handler: index.handler
      Events:
        ApiGETProductsId:
          Type: Api
          Properties: { Path: "/products/{id}", Method: GET, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }

  UpdateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-UpdateItem
      CodeUri: functions/update-item
      Handler: index.handler
      Events:
        ApiPUTProductsId:
          Type: Api
          Properties: { Path: "/products/{id}", Method: PUT, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }

  DeleteItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-DeleteItem
      CodeUri: functions/delete-item
      Handler: index.handler
      Events:
        ApiDELETEProductsId:
          Type: Api
          Properties: { Path: "/products/{id}", Method: DELETE, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }

  # ---- S1 · Rekognition DetectLabels ----
  EnrichLabelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-EnrichLabels
      CodeUri: sessions/S01-rekognition-labels/functions/enrich-labels
      Handler: app.lambda_handler
      Runtime: python3.12
      Environment:
        Variables:
          LABEL_MIN_CONFIDENCE: "80"
          LABEL_MAX_LABELS: "15"
      Events:
        ApiPOSTProductLabels:
          Type: Api
          Properties: { Path: "/products/{id}/labels", Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ rekognition:DetectLabels ]
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [ s3:GetObject ]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-frontend/*

  # ---- S2 · Rekognition Moderation + alt-text ----
  ModerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ModerateImage
      CodeUri: sessions/S02-moderation-alttext/functions/moderate-image
      Handler: app.lambda_handler
      Runtime: python3.12
      Environment:
        Variables:
          MODERATION_MIN_CONFIDENCE: "60"
      Events:
        ApiPOSTProductModerate:
          Type: Api
          Properties: { Path: "/products/{id}/moderate", Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ rekognition:DetectModerationLabels, rekognition:DetectLabels ]
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [ s3:GetObject ]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-frontend/*

  # ---- S3 · Comprehend Sentiment ----
  AnalyzeSentimentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-AnalyzeSentiment
      CodeUri: sessions/S03-comprehend-sentiment/functions/analyze-sentiment
      Handler: app.lambda_handler
      Runtime: python3.12
      Events:
        ApiPOSTSentiment:
          Type: Api
          Properties: { Path: /sentiment, Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ comprehend:DetectSentiment, comprehend:DetectDominantLanguage ]
              Resource: "*"

  # ---- S4 · Translate ----
  TranslateCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-TranslateCatalog
      CodeUri: sessions/S04-translate-multilang/functions/translate-catalog
      Handler: app.lambda_handler
      Runtime: python3.12
      Events:
        ApiPOSTProductTranslate:
          Type: Api
          Properties: { Path: "/products/{id}/translate", Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ translate:TranslateText, comprehend:DetectDominantLanguage ]
              Resource: "*"

  # ---- S5 · Polly + audio bucket ----
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-audio
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAudio
            Status: Enabled
            ExpirationInDays: 7

  SynthesizeVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SynthesizeVoice
      CodeUri: sessions/S05-polly-voice/functions/synthesize-voice
      Handler: app.lambda_handler
      Runtime: python3.12
      Environment:
        Variables:
          AUDIO_BUCKET: !Ref AudioBucket
      Events:
        ApiPOSTProductVoice:
          Type: Api
          Properties: { Path: "/products/{id}/voice", Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ polly:SynthesizeSpeech ]
              Resource: "*"
        - S3CrudPolicy: { BucketName: !Sub "${AWS::StackName}-audio" }

  # ---- S6 · Bedrock generacion ----
  GenerateDescriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GenerateDescription
      CodeUri: sessions/S06-bedrock-descripciones/functions/generate-description
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          BEDROCK_MAX_TOKENS: "300"
          BEDROCK_TEMPERATURE: "0.7"
      Events:
        ApiPOSTProductDescribe:
          Type: Api
          Properties: { Path: "/products/{id}/describe", Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ bedrock:InvokeModel ]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:us-*:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-haiku-20240307-v1:0

  # ---- S7 · Bedrock embeddings ----
  IndexEmbeddingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-IndexEmbeddings
      CodeUri: sessions/S07-bedrock-rag-busqueda/functions/index-embeddings
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 120
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
      Events:
        ApiPOSTSearchIndex:
          Type: Api
          Properties: { Path: /search/index, Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ bedrock:InvokeModel ]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-*::foundation-model/amazon.titan-embed-text-v2:0

  SemanticSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SemanticSearch
      CodeUri: sessions/S07-bedrock-rag-busqueda/functions/semantic-search
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          SEARCH_TOP_K: "5"
      Events:
        ApiGETSearch:
          Type: Api
          Properties: { Path: /search, Method: GET, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ bedrock:InvokeModel ]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-*::foundation-model/amazon.titan-embed-text-v2:0

  # ---- S8 · Bedrock RAG chatbot ----
  ShoppingAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ShoppingAssistant
      CodeUri: sessions/S08-bedrock-chatbot/functions/shopping-assistant
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          ASSISTANT_TOP_K: "3"
          BEDROCK_MAX_TOKENS: "400"
      Events:
        ApiPOSTAssistant:
          Type: Api
          Properties: { Path: /assistant, Method: POST, RestApiId: !Ref ProductsApi }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }
        - Statement:
            - Effect: Allow
              Action: [ bedrock:InvokeModel ]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-*::foundation-model/amazon.titan-embed-text-v2:0
                - !Sub arn:${AWS::Partition}:bedrock:us-*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:us-*:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-haiku-20240307-v1:0

  # ---- S10 · gobernanza (log group de invocacion) ----
  # La alarma de billing va en us-east-1 (metrica AWS/Billing) -> crear en consola/Budgets.
  BedrockInvocationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /techmoda/${AWS::StackName}/bedrock-invocations
      RetentionInDays: 30

  # ---- Frontend (S0) ----
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-frontend
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${FrontendBucket.Arn}/*
            Principal: '*'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [ GET, HEAD, OPTIONS ]
          CachedMethods: [ GET, HEAD ]
          ForwardedValues:
            QueryString: false
            Cookies: { Forward: none }
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: URL of the Products API
    Value: !Sub 'https://${ProductsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  ProductsTableName:
    Value: !Ref ProductsTable
  Region:
    Value: !Ref AWS::Region
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  AudioBucketName:
    Value: !Ref AudioBucket
